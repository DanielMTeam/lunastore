location /_px/ {
    internal;
    
    # Use public DNS resolver to resolve external hostnames
    resolver 8.8.8.8;
    
    # Pass to the external URL specified by Django in X-Target-Url header
    proxy_pass $http_x_target_url;
    
    # Enable SNI for external HTTPS servers
    proxy_ssl_server_name on;
    
    # Disable buffering to stream the file directly to the client
    # This prevents eating up server memory for large files
    proxy_buffering off;
    
    # Hide the technical header from the client
    proxy_hide_header X-Target-Url;
}
