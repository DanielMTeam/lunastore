name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_lunaspire:
        description: 'Force rebuild lunaspire docker image?'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # stage 1: linter
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pycodestyle
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Run pycodestyle
        run: |
          pycodestyle . --exclude=.venv,venv,migrations,.git --max-line-length=120

  # stage 2: test
  test:
    name: Run Django Tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lunastoredb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lunastoredb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Create .env file
        run: |
          # prefer repo secret when present; otherwise write a minimal ci .env
          if [ -n "${{ secrets.DJANGO_ENV_FILE }}" ]; then
            printf '%s\n' "${{ secrets.DJANGO_ENV_FILE }}" > .env
          else
            cat > .env <<'EOF'
          SECRET_KEY=ci-insecure-secret-key-for-tests-only
          DEBUG=True
          DB_NAME=lunastoredb
          DB_USER=postgres
          DB_PASSWORD=ci_postgres_pass
          DB_HOST=localhost
          DB_PORT=5432
          LUNASPIRE_SECRET_KEY=ci-lunaspire-secret
          LUNASPIRE_URL=http://127.0.0.1:8080
          API_URL=http://127.0.0.1:7088
          ALLOWED_HOSTS=localhost;127.0.0.1;testserver
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:8000
          CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8000
          SESSION_COOKIE_DOMAIN=
          CSRF_COOKIE_DOMAIN=
          GEO_DOMAIN_PROXY_ENABLED=False
          SENTRY_ENABLED=False
          TELEGRAM_LOGGER_ENABLED=False
          OIDC_SIGN_ALGO=RS256
          OIDC_CLIENT_ID=
          OIDC_CLIENT_SECRET=
          OIDC_ENDPOINT=
          OIDC_TOKEN_ENDPOINT=
          OIDC_USER_ENDPOINT=
          OIDC_JWKS_ENDPOINT=
          LOGIN_REDIRECT_URL=/
          LOGOUT_REDIRECT_URL=/login.php
          EOF
          fi

      - name: Ensure static directory
        run: mkdir -p static

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-insecure-secret-key-for-tests-only
          DEBUG: "True"
          DB_NAME: lunastoredb
          DB_USER: postgres
          DB_PASSWORD: ci_postgres_pass
          DB_HOST: localhost
          DB_PORT: "5432"
          LUNASPIRE_SECRET_KEY: ci-lunaspire-secret
          LUNASPIRE_URL: http://127.0.0.1:8080
          API_URL: http://127.0.0.1:7088
          ALLOWED_HOSTS: localhost;127.0.0.1;testserver
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
          CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000
          SESSION_COOKIE_DOMAIN: ""
          CSRF_COOKIE_DOMAIN: ""
          GEO_DOMAIN_PROXY_ENABLED: "False"
          SENTRY_ENABLED: "False"
          TELEGRAM_LOGGER_ENABLED: "False"
          OIDC_SIGN_ALGO: RS256
          OIDC_CLIENT_ID: ""
          OIDC_CLIENT_SECRET: ""
          OIDC_ENDPOINT: ""
          OIDC_TOKEN_ENDPOINT: ""
          OIDC_USER_ENDPOINT: ""
          OIDC_JWKS_ENDPOINT: ""
          LOGIN_REDIRECT_URL: /
          LOGOUT_REDIRECT_URL: /login.php
        run: |
          python manage.py test --noinput --keepdb

      - name: Clean up .env
        if: always()
        run: |
          rm -f .env

  # stage 3: build and push
  build:
    name: Build & Push Docker Image
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max