services:
  admin:
    image: registry.myslivets.com/myslivets/project-luna/lunastore:latest
    container_name: lunastore_admin
    command: gunicorn lunastore.wsgi:application --bind 0.0.0.0:8088 --workers 3
    environment:
      DJANGO_ROOT_URLCONF: lunastore.urls_private
    expose:
      - "8088"
    networks:
      - storenetwork
    restart: on-failure
    volumes: 
      - static_volume:/app/staticfiles_build
      - media_volume:/app/media

  web:
    image: registry.myslivets.com/myslivets/project-luna/lunastore:latest
    container_name: lunastore_web
    env_file:
      - .env
    expose:
      - "9088"
    restart: unless-stopped
    networks:
      - storenetwork
    volumes:
      - static_volume:/app/staticfiles_build
      - media_volume:/app/media

  api:
    image: registry.myslivets.com/myslivets/project-luna/lunastore:latest
    container_name: lunastore_api
    environment:
      DJANGO_ROOT_URLCONF: lunastore.urls_api
    expose:
      - "7088"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - storenetwork 
    volumes: 
      - static_volume:/app/staticfiles_build
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    container_name: lunastore_nginx
    ports:
      - "80:80"
      - "8088:8088"   # admin port for SSO
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - web
      - admin
      - api
    restart: unless-stopped
    networks:
      - storenetwork

networks:
  storenetwork:
    driver: bridge

volumes:
  static_volume:
  media_volume: