# ==============================================================================
# LunaStore — Nginx Virtual Hosts with Edge Geo Routing & Proxying
# ==============================================================================

upstream lunastore_web {
    server 127.0.0.1:9088;
    keepalive 32;
}

upstream lunastore_admin {
    server 127.0.0.1:8088;
    keepalive 16;
}

upstream lunastore_api {
    server 127.0.0.1:7088;
    keepalive 32;
}

upstream lunaspire_cdn {
    server 127.0.0.1:6080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Primary Global Domain (lunastore.app)
# Performs instant 302 redirect for regional users (e.g., RU -> ru.lunastore.app)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lunastore.app;

    # SSL configuration (uncomment & provide certs for HTTPS)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/lunastore.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lunastore.app/privkey.pem;

    client_max_body_size 100M;

    # Static assets (served directly by Nginx or cached)
    location /staticfiles/ {
        alias /opt/lunastore/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media uploads
    location /media/ {
        alias /opt/lunastore/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Dedicated API service (:7088)
    location /method/ {
        proxy_pass http://lunastore_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }

    location /v2/ {
        proxy_pass http://lunastore_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }

    # Main Web service (:9088) with instant edge redirect to regional domain
    location / {
        # Fast 302 redirect for visitors whose country maps to a regional domain
        if ($regional_domain != "lunastore.app") {
            return 302 $scheme://$regional_domain$request_uri;
        }

        proxy_pass http://lunastore_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }
}

# ------------------------------------------------------------------------------
# Regional Mirror (ru.lunastore.app)
# Handles requests directly without redirecting back
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ru.lunastore.app;

    # SSL configuration (uncomment & provide certs for HTTPS)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/ru.lunastore.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ru.lunastore.app/privkey.pem;

    client_max_body_size 100M;

    location /staticfiles/ {
        alias /opt/lunastore/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /opt/lunastore/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /method/ {
        proxy_pass http://lunastore_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }

    location /v2/ {
        proxy_pass http://lunastore_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }

    location / {
        proxy_pass http://lunastore_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Country-Code $client_country_code;
    }
}

