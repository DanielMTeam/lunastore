# ==============================================================================
# LunaStore — GeoIP2 Configuration for Nginx (ngx_http_geoip2_module)
# ==============================================================================
# Place or include this file inside the `http {}` block of your nginx.conf.
# Ensure ngx_http_geoip2_module is installed and loaded:
#   load_module modules/ngx_http_geoip2_module.so;
# ==============================================================================

# Path to the MaxMind GeoLite2/GeoIP2 Country database
geoip2 /opt/lunastore/apps/core/geolocation/geo.mmdb {
    auto_reload 60m;
    $client_country_code default=XX source=$remote_addr country iso_code;
}

# Resolve country from the client IP, never from an incoming country header.
# Behind Cloudflare, configure real_ip_header and set_real_ip_from with verified
# Cloudflare CIDRs so $remote_addr is restored only for a trusted peer.
# Set Django TRUSTED_PROXIES to the exact Nginx upstream peer addresses.

# Mapping country code to target regional base domain:
# Extend this mapping if additional regional mirrors are configured.
map "$request_method:$client_country_code" $regional_domain {
    default "";
    "GET:RU"  "ru.lunastore.app";
    "HEAD:RU" "ru.lunastore.app";
}
