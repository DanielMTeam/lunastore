# ==============================================================================
# LunaStore — GeoIP2 Configuration for Nginx (ngx_http_geoip2_module)
# ==============================================================================
# Place or include this file inside the `http {}` block of your nginx.conf.
# Ensure ngx_http_geoip2_module is installed and loaded:
#   load_module modules/ngx_http_geoip2_module.so;
# ==============================================================================

# Path to the MaxMind GeoLite2/GeoIP2 Country database
geoip2 /opt/lunastore/apps/core/geolocation/geo.mmdb {
    auto_reload 60m;
    $geoip2_data_country_code default=XX country iso_code;
}

# Multi-proxy country resolution:
# If request arrives through Cloudflare, $http_cf_ipcountry is prioritized.
# Otherwise, fall back to Nginx local MaxMind GeoIP2 lookup.
#
# NOTE ON CLOUDFLARE SECURITY:
# If Nginx is reachable directly from the public internet (not only Cloudflare IPs),
# external clients could spoof the "CF-IPCountry" header. To prevent this, either:
# 1) Use $geoip2_data_country_code directly without trusting $http_cf_ipcountry, OR
# 2) Configure ngx_http_realip_module to restore original client IPs and strip spoofed headers:
#      set_real_ip_from 173.245.48.0/20; (see https://www.cloudflare.com/ips/)
#      real_ip_header CF-Connecting-IP;
map $http_cf_ipcountry $client_country_code {
    ""      $geoip2_data_country_code;
    default $http_cf_ipcountry;
}

# Mapping country code to target regional base domain:
# Extend this mapping if additional regional mirrors are configured.
map $client_country_code $regional_domain {
    default "lunastore.app";
    RU      "ru.lunastore.app";
}
