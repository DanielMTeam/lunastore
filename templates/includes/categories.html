{% load i18n %}
{% load static %}

{% for category in categories %}
{% if active_category and category.id == active_category.id %}
<a class="{{ category.icon|default:'top' }}" id="active" href="/category.php?id={{ category.id }}">{{ category.name }}</a>
{% else %}
<a class="{{ category.icon|default:'top' }}" href="/category.php?id={{ category.id }}">{{ category.name }}</a>
{% endif %}
{% empty %}
    <li>{% trans "INFO_CATEGORY_LIST_EMPTY" %}</li>
{% endfor %}
