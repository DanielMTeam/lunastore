{% load static %}
<script src="{% static './js/search_mini.js'%}"></script>
<link rel="stylesheet" href='{% static "./css/main.css"%}'>
{% for category in categories %}
{% if active_category and category.id == active_category.id %}
<a href="/category.php?id={{ category.id }}"><li class="top" id="active">{{ category.name }}</li></a>
{% else %}
<a href="/category.php?id={{ category.id }}"><li class="top">{{ category.name }}</li></a>
{% endif %}
{% empty %}
    <li>пустаааа....</li>
{% endfor %}
