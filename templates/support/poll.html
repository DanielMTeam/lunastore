{% load i18n static %}
<div id="support-poll" class="ls_chat_toolbar" data-url="{{ poll_url }}" data-revision="{{ revision }}" data-refresh-url="{{ refresh_url }}">
    <button type="button" id="support-refresh" class="ls_chat_refresh">{% trans 'PAGE_SUPPORT_REFRESH_THREAD' %}</button>
    <p id="support-updates" style="display:none" role="status">{% trans 'PAGE_SUPPORT_UPDATES_AVAILABLE' %}</p>
    <p id="support-poll-error" style="display:none" role="status">{% trans 'PAGE_SUPPORT_POLL_FAILED' %}</p>
</div>
<noscript><p class="ls_chat_hint">{% trans 'PAGE_SUPPORT_REFRESH_WITHOUT_JS' %}</p></noscript>
<script src="{% static 'js/support.js' %}"></script>
