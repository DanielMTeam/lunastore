name: Telegram Notifications

on:
  push:
  pull_request:
  issues:

jobs:
  notify:
    runs-on: docker
    steps:
      - name: Send Telegram message
        run: |
          EVENT_TYPE=${FORGEJO_EVENT_NAME}
          REPO=${FORGEJO_REPOSITORY}
          ACTOR=${FORGEJO_ACTOR}
          BRANCH=${FORGEJO_REF##*/}
          COMMIT_MSG=$(echo "$FORGEJO_COMMIT_MESSAGE" | head -n 1)

          MESSAGE="📢 *${EVENT_TYPE}* in [${REPO}](https://forgejo.yourdomain.com/${REPO}) by *${ACTOR}*"
          if [ "$EVENT_TYPE" = "push" ]; then
            MESSAGE="${MESSAGE}%0A🪄 Branch: ${BRANCH}%0A💬 ${COMMIT_MSG}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="${MESSAGE}"
